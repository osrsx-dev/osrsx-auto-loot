apply plugin: 'io.osrsx.plugin'

osrsxPlugin {
    id = 'auto-loot'
    main = 'io.osrsx.plugins.autoloot.AutoLootPlugin'
    defaultPriority = 2
    group = 'io.osrsx.plugins'
    version = '1.2.0'
    name = 'Auto Loot'
    description = 'Picks up configured ground items within a radius.'
    authors = ['osrsx']
    tags = ['loot', 'pickup', 'utility']
}
